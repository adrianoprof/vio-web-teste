server {
    # Porta em que o Nginx atende dentro do container
    listen 80;
    server_name _;

    # Pasta que contém os arquivos gerados pelo Vite
    root /usr/share/nginx/html;
    index index.html;

    # Encaminha chamadas /api para o backend do Compose
    location /api/ {
        proxy_pass http://backend:3000;
    }

    # Disponibiliza o frontend React
    location / {
        try_files $uri $uri/ /index.html;
    }
}